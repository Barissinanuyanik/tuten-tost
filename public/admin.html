<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetim Paneli | Tüten Tost</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>.no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }</style>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col md:flex-row h-screen overflow-hidden">

    <div id="new-order-alert" class="hidden fixed top-6 right-6 bg-green-500 text-white px-6 py-4 rounded-xl shadow-2xl z-50 flex items-center gap-4 animate-bounce border-2 border-white cursor-pointer" onclick="location.reload()">
        <div>
            <strong class="block text-lg"><i class="fas fa-bell"></i> Yeni Mesaj/Sipariş Geldi!</strong>
            <span class="text-xs opacity-90">Ekranı yenilemek için tıklayın.</span>
        </div>
        <button class="bg-white text-green-600 hover:bg-green-50 font-black px-4 py-2 rounded-lg text-sm transition shadow-sm">Yenile</button>
    </div>

    <!-- SOL MENÜ -->
    <aside class="w-full md:w-64 bg-gray-900 text-white flex flex-col flex-shrink-0 z-20 shadow-lg md:shadow-none">
        <div class="p-4 md:p-6 text-center border-b border-gray-800 hidden md:block">
            <h1 class="text-xl font-black tracking-wider text-red-500">🔥 TÜTEN TOST</h1>
            <p class="text-[10px] text-gray-400 uppercase tracking-widest mt-1">Yönetim Paneli</p>
        </div>
        
        <nav class="flex-none md:flex-1 p-2 md:p-4 flex flex-row md:flex-col gap-2 md:gap-0 md:space-y-2 overflow-x-auto md:overflow-y-auto no-scrollbar">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn flex items-center justify-center md:justify-start gap-2 md:gap-3 px-4 py-2 md:py-3 rounded-xl transition whitespace-nowrap bg-red-600 text-white font-bold shadow">
                <i class="fas fa-chart-pie w-5 text-center"></i> <span class="text-sm md:text-base">Genel Durum</span>
            </button>
            <button onclick="switchTab('active_orders')" id="nav-active_orders" class="nav-btn flex items-center justify-center md:justify-start gap-2 md:gap-3 px-4 py-2 md:py-3 rounded-xl transition whitespace-nowrap text-gray-300 hover:bg-gray-800">
                <i class="fas fa-motorcycle w-5 text-center"></i> <span class="text-sm md:text-base">Aktif Siparişler</span>
            </button>
            <button onclick="switchTab('completed_orders')" id="nav-completed_orders" class="nav-btn flex items-center justify-center md:justify-start gap-2 md:gap-3 px-4 py-2 md:py-3 rounded-xl transition whitespace-nowrap text-gray-300 hover:bg-gray-800">
                <i class="fas fa-check-double w-5 text-center"></i> <span class="text-sm md:text-base">Geçmiş Siparişler</span>
            </button>
            <button onclick="switchTab('whatsapp_inbox')" id="nav-whatsapp_inbox" class="nav-btn flex items-center justify-center md:justify-start gap-2 md:gap-3 px-4 py-2 md:py-3 rounded-xl transition whitespace-nowrap text-gray-300 hover:bg-gray-800">
                <i class="fab fa-whatsapp w-5 text-center"></i> <span class="text-sm md:text-base">WhatsApp Kutusu</span>
            </button>
            <button onclick="switchTab('chat_logs')" id="nav-chat_logs" class="nav-btn flex items-center justify-center md:justify-start gap-2 md:gap-3 px-4 py-2 md:py-3 rounded-xl transition whitespace-nowrap text-gray-300 hover:bg-gray-800">
                <i class="fas fa-comments w-5 text-center"></i> <span class="text-sm md:text-base">Web Bot Sohbetler</span>
            </button>
            <button onclick="switchTab('customers')" id="nav-customers" class="nav-btn flex items-center justify-center md:justify-start gap-2 md:gap-3 px-4 py-2 md:py-3 rounded-xl transition whitespace-nowrap text-gray-300 hover:bg-gray-800">
                <i class="fas fa-users w-5 text-center"></i> <span class="text-sm md:text-base">Müşteriler</span>
            </button>
            <button onclick="switchTab('products')" id="nav-products" class="nav-btn flex items-center justify-center md:justify-start gap-2 md:gap-3 px-4 py-2 md:py-3 rounded-xl transition whitespace-nowrap text-gray-300 hover:bg-gray-800">
                <i class="fas fa-hamburger w-5 text-center"></i> <span class="text-sm md:text-base">Ürün Yönetimi</span>
            </button>
        </nav>

        <div class="p-2 md:p-4 border-t border-gray-800 flex flex-row md:flex-col gap-2 md:gap-3 md:space-y-3">
            <button id="enable-sound-btn" class="flex-1 w-full bg-blue-600 hover:bg-blue-700 text-white text-[10px] md:text-xs font-bold px-2 md:px-3 py-2 md:py-2.5 rounded-lg transition shadow flex justify-center items-center gap-1 md:gap-2">
                <i class="fas fa-volume-up"></i> <span class="hidden md:inline">Ses Bildirimi Aç</span><span class="md:hidden">Ses</span>
            </button>
            <a href="/" class="flex-1 flex items-center justify-center gap-1 md:gap-2 w-full bg-gray-800 hover:bg-red-600 text-white text-[10px] md:text-xs font-bold px-2 md:px-3 py-2 md:py-2.5 rounded-lg transition">
                <i class="fas fa-sign-out-alt"></i> Çıkış
            </a>
        </div>
    </aside>

    <!-- İÇERİK ALANI -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-gray-100">
        <header class="bg-white shadow-sm px-4 md:px-8 py-4 flex justify-between items-center z-10">
            <h2 id="page-title" class="text-sm md:text-xl font-black text-gray-800 uppercase truncate">Ön Muhasebe & Dashboard</h2>
            <div id="current-date" class="text-[10px] md:text-sm font-bold text-gray-500 whitespace-nowrap ml-2"></div>
        </header>
        <div id="content-area" class="flex-1 overflow-y-auto p-4 md:p-8"></div>
    </main>

    <script>
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('tr-TR') + ' - ' + new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
        let currentTab = 'dashboard';
        let filterDate = new Date().toISOString().split('T')[0];
        let lastKnownOrderId = 0;
        let activeWaPhone = null;

        async function loadData() {
            const res = await fetch(`/api/admin?action=data&filter_date=${filterDate}`);
            const data = await res.json();
            window.adminData = data;
            if (lastKnownOrderId === 0 && data.latest_order_id) {
                lastKnownOrderId = data.latest_order_id;
            }
            renderTab();
        }

        async function apiAction(payload) {
            await fetch('/api/admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            await loadData();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = "nav-btn flex items-center justify-center md:justify-start gap-2 md:gap-3 px-4 py-2 md:py-3 rounded-xl transition whitespace-nowrap text-gray-300 hover:bg-gray-800 bg-gray-800 md:bg-transparent";
            });
            const activeBtn = document.getElementById('nav-' + tab);
            let color = 'bg-red-600';
            if (tab === 'whatsapp_inbox') color = 'bg-green-600';
            if(activeBtn) activeBtn.className = `nav-btn flex items-center justify-center md:justify-start gap-2 md:gap-3 px-4 py-2 md:py-3 rounded-xl transition whitespace-nowrap ${color} text-white font-bold shadow`;
            renderTab();
        }

        function cleanChatLog(html) {
            if (!html) return '';
            let text = html.replace(/<br\s*\/?>/gi, "\n").replace(/<\/div>|<\/li>|<\/p>/gi, "\n").replace(/<\/span><span/gi, "</span> - <span");
            let div = document.createElement("div"); div.innerHTML = text;
            return div.innerText.replace(/\n{3,}/g, "\n\n").trim();
        }

        function formatTime(dateStr) {
            if (!dateStr) return '';
            return new Date(dateStr).toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
        }

        function renderTab() {
            const area = document.getElementById('content-area');
            const title = document.getElementById('page-title');
            const data = window.adminData;
            if (!data) return;

            if (currentTab === 'dashboard') {
                title.innerHTML = '<i class="fas fa-chart-pie text-red-500 mr-2"></i> Ön Muhasebe & Dashboard';
                let productOptions = data.products.map(p => `<option value="${p.name}" data-price="${p.price}">${p.name}</option>`).join('');
                
                area.innerHTML = `
                    <div class="space-y-6 max-w-[1400px] mx-auto pb-20">
                        <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-indigo-500 flex justify-between items-center flex-wrap gap-4">
                            <div>
                                <h3 class="font-black text-gray-800 text-lg"><i class="fas fa-calendar-alt text-indigo-500"></i> Günlük Kasa Özeti</h3>
                                <p class="text-xs text-gray-500">Kasa durumu seçtiğiniz güne göre hesaplanır.</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <input type="date" value="${filterDate}" onchange="filterDate=this.value; loadData();" class="border border-gray-300 px-4 py-2 rounded-xl text-sm font-bold bg-gray-50 cursor-pointer outline-none">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                            <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-amber-500 flex flex-col justify-between relative overflow-hidden">
                                <div>
                                    <h2 class="text-gray-500 font-bold text-sm uppercase tracking-wider mb-4"><i class="fas fa-wallet text-amber-500"></i> Kasa Durumu</h2>
                                    <div class="space-y-2 mb-4">
                                        <div class="flex justify-between items-center text-sm font-semibold"><span class="text-green-600">Tahsilat (Giren):</span><span>+${data.stats.income} TL</span></div>
                                        <div class="flex justify-between items-center text-sm font-semibold"><span class="text-red-600">Ödenen (Çıkan):</span><span>-${data.stats.expense} TL</span></div>
                                        <hr>
                                        <div class="flex justify-between items-center text-2xl font-black text-gray-900 pt-2"><span>Net Kasa:</span><span class="${data.stats.net >= 0 ? 'text-green-600' : 'text-red-600'}">${data.stats.net} TL</span></div>
                                    </div>
                                </div>
                                <div class="mt-2 bg-amber-50 p-3 rounded-xl border border-amber-200">
                                    <h3 class="text-xs font-bold text-amber-800 mb-2"><i class="fas fa-hand-holding-usd"></i> Kasadan Para Al (Çıkış)</h3>
                                    <div class="flex flex-col gap-2">
                                        <input type="text" id="wd_desc" placeholder="Kime / Neden Verildi?" class="w-full border border-amber-300 p-2 rounded-lg text-xs outline-none bg-white">
                                        <div class="flex gap-2">
                                            <input type="number" id="wd_amount" placeholder="Tutar (TL)" class="w-full border border-amber-300 p-2 rounded-lg text-xs outline-none bg-white">
                                            <button onclick="apiAction({action:'withdraw_cash', description: document.getElementById('wd_desc').value, amount: document.getElementById('wd_amount').value})" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-3 py-2 rounded-lg transition text-xs whitespace-nowrap">Çek</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-red-500">
                                <h2 class="text-gray-500 font-bold text-sm uppercase tracking-wider mb-4"><i class="fas fa-box-open text-red-500"></i> Malzeme / Masraf Gir</h2>
                                <div class="space-y-3 relative">
                                    <div class="relative">
                                        <input type="text" id="exp_vendor" placeholder="Tedarikçi/Cari" class="w-full border p-2 rounded-lg text-sm outline-none" autocomplete="off">
                                        <div id="vendor_dropdown" class="absolute z-50 w-full bg-white border border-gray-300 mt-1 max-h-40 overflow-y-auto hidden shadow-xl rounded-lg"></div>
                                    </div>
                                    <div class="relative">
                                        <input type="text" id="exp_desc" placeholder="Açıklama" class="w-full border p-2 rounded-lg text-sm outline-none" autocomplete="off">
                                        <div id="item_dropdown" class="absolute z-50 w-full bg-white border border-gray-300 mt-1 max-h-40 overflow-y-auto hidden shadow-xl rounded-lg"></div>
                                    </div>
                                    <div class="grid grid-cols-2 gap-2">
                                        <input type="number" id="exp_qty" value="1" placeholder="Adet" class="w-full border p-2 rounded-lg text-sm outline-none">
                                        <input type="number" id="exp_amount" placeholder="Tutar (TL)" class="w-full border p-2 rounded-lg text-sm outline-none">
                                    </div>
                                    <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded-lg border border-gray-200">
                                        <label class="flex items-center gap-2 text-xs font-bold text-gray-800 cursor-pointer"><input type="checkbox" id="exp_is_paid" checked class="accent-red-600 w-4 h-4"> Nakit Ödendi</label>
                                    </div>
                                    <button onclick="addExpense()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2.5 rounded-lg transition text-sm shadow-md">Masrafı Kaydet</button>
                                </div>
                            </div>

                            <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-blue-500">
                                <h2 class="text-gray-500 font-bold text-sm uppercase tracking-wider mb-4"><i class="fas fa-plus-circle text-blue-500"></i> Hızlı Sipariş Ekle</h2>
                                <div class="space-y-3">
                                    <div class="grid grid-cols-2 gap-2">
                                        <input type="text" id="qo_name" placeholder="Müşteri Adı" class="border p-2 rounded-lg text-sm outline-none">
                                        <input type="text" id="qo_phone" placeholder="Telefon" class="border p-2 rounded-lg text-sm outline-none">
                                    </div>
                                    <input type="text" id="qo_address" placeholder="Adres / Not" class="w-full border p-2 rounded-lg text-sm outline-none">
                                    <div class="grid grid-cols-3 gap-2">
                                        <select id="qo_product" class="col-span-2 border p-2 rounded-lg text-sm outline-none bg-white" onchange="updateQOPrice()">
                                            <option value="" data-price="0">Ürün Seçin...</option>
                                            ${productOptions}
                                            <option value="Özel Sipariş" data-price="0">Diğer (Özel)</option>
                                        </select>
                                        <input type="number" id="qo_qty" value="1" min="1" placeholder="Adet" class="border p-2 rounded-lg text-sm outline-none" onchange="updateQOPrice()">
                                    </div>
                                    <div class="grid grid-cols-3 gap-2 mt-2">
                                        <select id="qo_drink" class="border p-2 rounded-lg text-xs font-bold outline-none" onchange="updateQOPrice()">
                                            <option value="Yok" data-price="0">İçecek Yok</option>
                                            <option value="Kola" data-price="45">Kola (+45)</option>
                                            <option value="Ayran" data-price="25">Ayran (+25)</option>
                                        </select>
                                        <select id="qo_payment" class="border p-2 rounded-lg text-xs font-bold outline-none">
                                            <option value="Nakit">Nakit</option><option value="Kredi Kartı / POS">Kredi Kartı / POS</option>
                                        </select>
                                        <input type="number" id="qo_price" placeholder="Tutar" class="border p-2 rounded-lg text-sm font-bold text-red-600 outline-none">
                                    </div>
                                    <div class="flex items-center justify-between mt-2">
                                        <label class="flex items-center gap-1 text-xs font-bold text-green-700 cursor-pointer bg-green-50 px-2 py-1.5 rounded border border-green-200">
                                            <input type="checkbox" id="qo_is_paid" class="accent-green-600"> Peşin Ödendi
                                        </label>
                                        <button onclick="addQuickOrder()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-lg transition text-xs shadow-md">Siparişi Gir</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-6">
                            <div class="bg-white p-5 rounded-2xl shadow-sm border flex flex-col h-[400px]">
                                <h2 class="text-base font-black mb-1 text-gray-800 flex items-center gap-2"><i class="fas fa-arrow-down text-green-500"></i> Alacaklarımız</h2>
                                <div class="flex-1 overflow-y-auto space-y-2 pr-2">
                                    ${(!data.unpaidOrdersGrouped || data.unpaidOrdersGrouped.length===0) ? '<p class="text-xs text-gray-500 text-center py-4">Tüm cariler ödendi.</p>' : data.unpaidOrdersGrouped.map(uo => `
                                        <div class="flex justify-between items-center p-3 bg-green-50 rounded-xl border border-green-100">
                                            <div><span class="block font-bold text-sm text-gray-900">${uo.customer_name}</span><span class="text-[11px] text-gray-500">${uo.item_count} İşlem</span></div>
                                            <div class="text-right"><span class="block font-black text-green-600">${uo.total_debt} TL</span>
                                            <button onclick="apiAction({action:'pay_customer_debt', customer_name:'${uo.customer_name}'})" class="mt-1 bg-green-600 text-white text-[10px] font-bold px-2 py-1 rounded">TAHSİL ET</button></div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="bg-white p-5 rounded-2xl shadow-sm border flex flex-col h-[400px]">
                                <h2 class="text-base font-black mb-1 text-gray-800 flex items-center gap-2"><i class="fas fa-arrow-up text-red-500"></i> Borçlarımız</h2>
                                <div class="flex-1 overflow-y-auto space-y-2 pr-2">
                                    ${(!data.unpaidExpensesGrouped || data.unpaidExpensesGrouped.length===0) ? '<p class="text-xs text-gray-500 text-center py-4">Tedarikçi borcu yok.</p>' : data.unpaidExpensesGrouped.map(ue => `
                                        <div class="flex justify-between items-center p-3 bg-red-50 rounded-xl border border-red-100">
                                            <div><span class="block font-bold text-sm text-gray-900">${ue.vendor_name}</span></div>
                                            <div class="text-right"><span class="block font-black text-red-600">${ue.total_debt} TL</span>
                                            <button onclick="apiAction({action:'pay_vendor_debt', vendor_name:'${ue.vendor_name}'})" class="mt-1 bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded">KASADAN ÖDE</button></div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="bg-white p-5 rounded-2xl shadow-sm border flex flex-col h-[400px]">
                                <h2 class="text-base font-black mb-1 text-gray-800 flex items-center gap-2"><i class="fas fa-history text-gray-500"></i> Masraf Listesi</h2>
                                <div class="flex-1 overflow-y-auto space-y-2 pr-2">
                                    ${data.expenses.map(exp => `
                                        <div class="flex justify-between items-center p-2 rounded-lg border ${exp.description.includes('[KASA ÇEKİMİ]') ? 'bg-orange-50 border-orange-200' : 'bg-gray-50 border-gray-200'}">
                                            <div class="w-full">
                                                <div class="flex justify-between items-start w-full">
                                                    <span class="font-bold text-xs text-gray-900 w-3/4 truncate">${exp.vendor_name} <span class="text-gray-500 font-normal ml-1">(${exp.quantity}x)</span></span>
                                                    <span class="font-black text-red-600 text-sm w-1/4 text-right">${exp.amount} TL</span>
                                                </div>
                                                <div class="flex justify-between items-center mt-1">
                                                    <span class="text-[10px] ${exp.is_paid ? 'text-green-600' : 'text-red-500'} font-bold">${exp.is_paid ? '✓ Ödendi' : '❌ Borç'}</span>
                                                    <button onclick="apiAction({action:'delete_expense', expense_id:${exp.id}})" class="text-red-400 hover:text-red-600 text-[10px]"><i class="fas fa-trash"></i> Sil</button>
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>`;
                
                setTimeout(() => {
                    setupAutocomplete('exp_vendor', 'vendor_dropdown', data.vendorList || []);
                    setupAutocomplete('exp_desc', 'item_dropdown', data.itemList || []);
                }, 100);

            } else if (currentTab === 'active_orders' || currentTab === 'completed_orders') {
                const isCompleted = currentTab === 'completed_orders';
                const orders = isCompleted ? data.completedOrders : data.activeOrders;
                title.innerHTML = isCompleted ? '<i class="fas fa-check-double text-green-500 mr-2"></i> Tamamlanan Siparişler' : '<i class="fas fa-motorcycle text-amber-500 mr-2"></i> Bekleyen & Yoldaki Siparişler';
                
                let html = `<div class="max-w-[1400px] mx-auto pb-20">`;
                if(isCompleted) {
                    const rev = orders.filter(o=>o.status==='Teslim Edildi').reduce((a,c)=>a+c.total_price,0);
                    const compCount = orders.filter(o=>o.status==='Teslim Edildi').length;
                    const cancCount = orders.filter(o=>o.status==='İptal Edildi').length;
                    html += `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-green-500 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div class="flex items-center gap-6">
                                <div><h3 class="font-black text-gray-800 text-lg"><i class="fas fa-chart-line text-green-500"></i> Günlük Satış Özeti</h3><p class="text-xs text-gray-500">${filterDate}</p></div>
                                <div class="hidden md:flex gap-4 border-l pl-4 border-gray-200">
                                    <div class="text-center"><span class="block text-[10px] font-bold text-gray-400 uppercase">Toplam Ciro</span><span class="text-lg font-black text-green-600">${rev} TL</span></div>
                                    <div class="text-center"><span class="block text-[10px] font-bold text-gray-400 uppercase">Biten/İptal</span><span class="text-lg font-black text-gray-800">${compCount} / <span class="text-red-500">${cancCount}</span></span></div>
                                </div>
                            </div>
                            <input type="date" value="${filterDate}" onchange="filterDate=this.value; loadData();" class="border border-gray-300 px-3 py-2 rounded-xl text-sm font-bold bg-gray-50 cursor-pointer outline-none">
                        </div>`;
                }
                
                if (!orders || orders.length === 0) {
                    html += `<p class="text-center text-gray-500 py-12 bg-white rounded-2xl shadow">Sipariş bulunmuyor.</p>`;
                } else {
                    html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">` + orders.map(o => `
                        <div class="bg-white rounded-2xl shadow-sm border ${o.status==='İptal Edildi' ? 'border-red-400 bg-red-50/30' : (o.is_paid?'border-green-400':'border-gray-200')} p-5 flex flex-col justify-between gap-4">
                            <div class="flex justify-between items-start border-b pb-3 border-gray-100">
                                <div class="space-y-1">
                                    <div class="flex items-center gap-2">
                                        <span class="bg-gray-900 text-white font-black px-2 py-1 rounded text-xs">#${o.id}</span>
                                        <span class="text-[11px] text-gray-500"><i class="far fa-calendar"></i> ${formatTime(o.created_at)}</span>
                                        <span class="font-bold px-2 py-0.5 rounded text-[10px] ${o.is_paid ? 'bg-green-100 text-green-700 border-green-300' : 'bg-amber-100 text-amber-700 border-amber-300'}">${o.is_paid ? '<i class="fas fa-check"></i> ÖDENDİ' : '<i class="fas fa-hourglass-half"></i> BORÇLU'}</span>
                                    </div>

                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-purple-500">
                        <h2 class="text-xl font-black mb-4 text-gray-800"><i class="fas fa-plus-circle text-purple-500"></i> Yeni Ürün Ekle</h2>
                        <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">

                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">` + data.products.map(p => `

                                    <span class="absolute top-2 right-2 ${p.stock<=5?'bg-red-600':'bg-green-600'} text-white text-[10px] font-black px-2 py-1 rounded shadow-md">Stok: ${p.stock}</span>
                                    <img src="${p.img}" class="w-full h-full object-cover">

                                        <select id="pbread_${p.id}" class="w-full border border-gray-300 p-2 rounded-lg text-sm font-semibold outline-none focus:ring-1 focus:ring-purple-500">

                                            <option value="11x11 cm" ${p.bread_type=='11x11 cm'?'selected':''}>11x11 cm Ekmek</option>
                                            <option value="Sandviç Ekmeği" ${p.bread_type=='Sandviç Ekmeği'?'selected':''}>Sandviç Ekmeği</option>
                                            <option value="Standart" ${p.bread_type=='Standart'?'selected':''}>Standart / İçecek</option>
                                        </select>
                                    </div>
                                    <div class="grid grid-cols-2 gap-2">
                                        <div>
                                            <label class="text-xs font-bold text-gray-500">Fiyat (TL):</label>
                                            <input type="number" id="pprice_${p.id}" value="${p.price}" class="w-full border p-2 rounded-lg text-sm font-bold text-red-600 outline-none focus:ring-1 focus:ring-purple-500">

                                            <input type="number" id="pstock_${p.id}" value="${p.stock}" class="w-full border p-2 rounded-lg text-sm font-bold text-blue-600 outline-none focus:ring-1 focus:ring-purple-500">

                                        <textarea id="pdesc_${p.id}" class="w-full border border-gray-300 p-2 rounded-lg text-sm font-semibold outline-none focus:ring-1 focus:ring-purple-500" rows="2">${p.description || ''}</textarea>

        // Dashboard Functions
        function addExpense() {
            const vendor_name = document.getElementById('exp_vendor').value;
            const description = document.getElementById('exp_desc').value;
            const quantity = parseFloat(document.getElementById('exp_qty').value || 1);
            const amount = parseFloat(document.getElementById('exp_amount').value || 0);
            const is_paid = document.getElementById('exp_is_paid').checked ? 1 : 0;
            if (!vendor_name || !description || amount <= 0) return alert("Lütfen tüm alanları doldurun.");
            apiAction({ action: 'add_expense', vendor_name, description, quantity, amount, is_paid });
        }

        function updateQOPrice() {
            const prod = document.getElementById('qo_product');
            const drink = document.getElementById('qo_drink');
            const qty = parseInt(document.getElementById('qo_qty').value || 1);
            if(prod && drink) {
                const bPrice = parseFloat(prod.options[prod.selectedIndex].getAttribute('data-price')) || 0;
                const dPrice = parseFloat(drink.options[drink.selectedIndex].getAttribute('data-price')) || 0;
                if(prod.value !== "Özel Sipariş" && prod.value !== "") {
                    document.getElementById('qo_price').value = (bPrice + dPrice) * qty;
                }
            }
        }

        function addQuickOrder() {
            const customer_name = document.getElementById('qo_name').value;
            const phone = document.getElementById('qo_phone').value;
            const address = document.getElementById('qo_address').value;
            const product_name = document.getElementById('qo_product').value;
            const quantity = document.getElementById('qo_qty').value;
            const drink = document.getElementById('qo_drink').value;
            const payment_method = document.getElementById('qo_payment').value;
            const price = document.getElementById('qo_price').value;
            const is_paid = document.getElementById('qo_is_paid').checked ? 1 : 0;
            
            if(!customer_name || !phone || !address || !product_name || !price) return alert("Eksik alanları doldurun.");
            apiAction({action:'admin_place_order', customer_name, phone, address, product_name, quantity, drink, payment_method, price, is_paid});
        }

        // WhatsApp Functions
        function selectWaPhone(phone) {
            activeWaPhone = phone;
            apiAction({action: 'mark_wa_read', wa_phone: phone});
        }
        function sendWaMsg() {
            const input = document.getElementById('wa_msg_input');
            const msg = input.value.trim();
            if(!msg || !activeWaPhone) return;
            apiAction({action: 'send_wa_reply', wa_phone: activeWaPhone, wa_message: msg});
            input.value = '';
        }

        // Chat Log Functions
        function showChatLog(id) {
            const log = window.adminData.chatLogs.find(l => l.id === id);
            if(log) {
                document.getElementById('chat_modal_content').innerHTML = cleanChatLog(log.chat_data);
                document.getElementById('chat_modal').classList.remove('hidden');
            }
        }

        // Product Functions (Güncellendi)
        function saveProduct(id) {
            if (id === 0) {
                const name = document.getElementById('new_p_name').value;
                const price = parseFloat(document.getElementById('new_p_price').value || 0);
                const stock = parseInt(document.getElementById('new_p_stock').value || 0, 10);
                const bread_type = document.getElementById('new_p_bread').value;
                const description = document.getElementById('new_p_desc').value;
                if(!name || price<=0) return alert("İsim ve fiyat zorunlu");
                apiAction({ action: 'save_product', name, price, stock, bread_type, description });
            } else {
                const name = document.getElementById('pname_' + id).value;
                const price = parseFloat(document.getElementById('pprice_' + id).value || 0);
                const stock = parseInt(document.getElementById('pstock_' + id).value || 0, 10);
                const description = document.getElementById('pdesc_' + id).value;
                const bread_type = document.getElementById('pbread_' + id).value;
                apiAction({ action: 'save_product', id, name, price, stock, bread_type, description });
            }
        }

        // Autocomplete
        function setupAutocomplete(inputId, dropdownId, dataList) {
            const input = document.getElementById(inputId);
            const dropdown = document.getElementById(dropdownId);
            if(!input || !dropdown) return;

            function render(list, filterText = "") {
                dropdown.innerHTML = ''; 
                if(list.length === 0) { dropdown.classList.add('hidden'); return; }
                list.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'p-2.5 hover:bg-red-50 cursor-pointer text-xs font-semibold text-gray-700 border-b border-gray-100 transition';
                    div.innerText = item;
                    div.addEventListener('mousedown', (e) => { e.preventDefault(); input.value = item; dropdown.classList.add('hidden'); });
                    dropdown.appendChild(div);
                });
                dropdown.classList.remove('hidden');
            }

            input.addEventListener('input', function() {
                const val = this.value.toLocaleLowerCase('tr-TR');
                render(val ? dataList.filter(s => s.toLocaleLowerCase('tr-TR').includes(val)) : dataList, val);
            });
            input.addEventListener('focus', function() {
                const val = this.value.toLocaleLowerCase('tr-TR');
                render(val ? dataList.filter(s => s.toLocaleLowerCase('tr-TR').includes(val)) : dataList, val);
            });
            input.addEventListener('blur', function() { setTimeout(() => { dropdown.classList.add('hidden'); }, 150); });
        }

        const notificationSound = new Audio('/zil.mp3');
        notificationSound.loop = true;
        let soundEnabled = false;

        document.getElementById('enable-sound-btn').addEventListener('click', function() {
            soundEnabled = true;
            notificationSound.play().then(() => {
                notificationSound.pause();
                notificationSound.currentTime = 0;
            }).catch(e => {});
            this.innerHTML = '<i class="fas fa-check-circle"></i> <span class="hidden md:inline">Ses Aktif</span><span class="md:hidden">Aktif</span>';
            this.className = "flex-1 flex items-center justify-center gap-1 md:gap-2 w-full bg-green-600 text-white text-[10px] md:text-xs font-bold px-2 md:px-3 py-2 md:py-2.5 rounded-lg transition shadow";
        });

        setInterval(() => {
            fetch(`/api/admin?action=check_new&last_id=${lastKnownOrderId}`)
                .then(r => r.json())
                .then(d => {
                    if (d.new_orders > 0) {
                        if (soundEnabled) notificationSound.play().catch(e => {});
                        document.getElementById('new-order-alert').classList.remove('hidden');
                        document.title = "(🔔 Yeni) " + document.title;
                    }
                });
        }, 10000);

        loadData();
    </script>
