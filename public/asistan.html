<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tüten Tost Asistanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-stone-100 text-gray-800 font-sans flex flex-col w-full h-[100dvh] rounded-2xl border-2 border-red-600 shadow-2xl overflow-hidden">
    <header class="bg-red-600 text-white p-3 shadow-md flex justify-between items-center flex-shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-white rounded-full flex items-center justify-center text-xl">🥪</div>
            <div>
                <h1 class="font-black text-base">Tüten Tost Asistanı</h1>
                <span class="text-[10px] text-green-300 font-medium">Çevrimiçi</span>
            </div>
        </div>
        <button onclick="if(window.parent && window.parent.closeChatIframe) window.parent.closeChatIframe()" class="text-white hover:text-red-200 p-1"><i class="fas fa-chevron-down text-lg"></i></button>
    </header>

    <main id="chat-messages" class="flex-1 overflow-y-auto p-3 flex flex-col space-y-3 bg-stone-100 text-xs">
        <div class="bg-white p-3 rounded-2xl shadow-sm border space-y-2">
            <strong>🤖 Asistan:</strong>
            <p>Merhabalar, Tüten Tost'a hoş geldiniz! İşleminizi aşağıdan hızlıca seçebilirsiniz:</p>
            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="sendChip('Hemen Tost Siparişi Ver')" class="bg-red-600 text-white font-bold p-2 rounded-xl text-[11px]">Hemen Sipariş Ver</button>
                <button onclick="sendChip('Menüyü Göster')" class="bg-red-50 text-red-600 border border-red-200 font-bold p-2 rounded-xl text-[11px]">Menüyü Göster</button>
            </div>
        </div>
    </main>

    <footer class="bg-stone-200 p-2.5 flex gap-2 flex-shrink-0 border-t">
        <input type="text" id="chat-input" class="flex-1 border p-2.5 rounded-xl text-xs outline-none bg-white" placeholder="Mesajınızı yazın..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()" class="bg-red-600 text-white px-4 rounded-xl font-bold"><i class="fas fa-paper-plane"></i></button>
    </footer>

    <script>
        let chatHistory = [];
        let sessionId = "app_" + Math.random().toString(36).substr(2, 9);

        async function sendMsg() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            const box = document.getElementById('chat-messages');
            box.innerHTML += `<div class="self-end bg-red-600 text-white p-2.5 rounded-xl max-w-[85%]">${text}</div>`;
            input.value = "";
            chatHistory.push({ role: "user", parts: [{ text }] });
            box.scrollTop = box.scrollHeight;

            try {
                const res = await fetch("/api/bot", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chatHistory, sessionId })
                });
                const data = await res.json();
                if (data.text) {
                    box.innerHTML += `<div class="self-start bg-white border p-3 rounded-xl max-w-[90%]"><strong>🤖 Asistan:</strong><br>${data.text.replace(/\n/g, '<br>')}</div>`;
                    chatHistory.push({ role: "model", parts: [{ text: data.text }] });
                    box.scrollTop = box.scrollHeight;
                }
            } catch (e) {
                box.innerHTML += `<div class="text-red-600 font-bold">Bağlantı hatası oluştu.</div>`;
            }
        }

        window.sendChip = function(txt) {
            document.getElementById('chat-input').value = txt;
            sendMsg();
        };
    </script>
</body>
</html>
